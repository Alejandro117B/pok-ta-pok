*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,canvas:focus-visible{outline:2px solid #d3b775;outline-offset:4px}button:disabled{cursor:default}[hidden]{display:none!important}.stage{position:relative;width:100%;height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse,#16141c,#08090e 75%);isolation:isolate;overflow:hidden}.viewport{position:relative;width:min(100%,calc(100svh * 24 / 11));aspect-ratio:24/11;isolation:isolate;background:#101019;box-shadow:0 0 100px #0009}.viewport:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px #06060b60;border:1px solid #70604445;z-index:3}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;outline-offset:-5px!important}.hud{position:absolute;left:50%;top:5%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(8px,1.4vw,23px);height:39px;padding:0 18px;color:#e1d2b3;background:linear-gradient(90deg,transparent,#0c0c14e8 18%,#0c0c14e8 82%,transparent);pointer-events:none;z-index:2}.hud svg{width:clamp(11px,1.3vw,18px);height:clamp(11px,1.3vw,18px);shape-rendering:crispEdges}.sun-emblem,.sun-score{color:var(--red)}.jade-emblem,.jade-score{color:var(--jade)}.score{font-size:clamp(16px,1.9vw,27px);min-width:13px;text-align:center;font-variant-numeric:tabular-nums}.hud time{font-family:'Courier New',monospace;font-size:clamp(12px,1.25vw,18px);letter-spacing:2px;color:#b6ae9c;border-left:1px solid #78644755;border-right:1px solid #78644755;padding:0 19px}.hud.overtime time{color:#eab06c}.tools{position:absolute;right:3%;top:5%;display:flex;gap:5px;z-index:5}.icon-button{display:grid;place-items:center;width:32px;height:32px;padding:7px;border:1px solid transparent;background:#0a0b1280;color:#aaa087;opacity:.75}.icon-button:hover{opacity:1;border-color:#7e ttom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none;z-index:6}.mobile-controls>div{display:flex;gap:9px;pointer-events:auto}.mobile-controls button{display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;width:49px;height:49px;border:1px solid #83745077;border-radius:3px;background:#0d111bbf;color:#c3b18e;font:22px 'Courier New',monospace}.mobile-controls .touch-hit{background:#67503c99;border-color:#b4965b88;color:#e0b26e}.mobile-controls button.pressed{background:#a48a5399;color:#ffedc1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.stage:fullscreen{height:100dvh}.stage:fullscreen .viewport{width:min(100%,calc(100dvh * 24 / 11))}

  <script type="module">const WORLD = Object.freeze({ width: 1440, height: 660, ground: 536, gravity: 1080, ballRadius: 13, hoopY: 323, hoopRadius: 32, leftHoop: 136, rightHoop: 1304 });
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
class Match {
  constructor(onEvent = () => {}) {
    this.onEvent = onEvent;
    this.mode = 'solo';
    this.state = 'ready';
    this.scores = [0, 0];
    this.time = 120;
    this.overtime = false;
    this.elapsed = 0;
    this.particles = [];
    this.selectedPlayers = [0, 2];
    this.selectionHeld = new Set();
    this.resetCourt();
  }
  resetCourt() {
    this.players = [
      this.makePlayer(400, 0, true), this.makePlayer(570, 0, false),
      this.makePlayer(1040, 1, true), this.makePlayer(870, 1, false),
    ];
    this.ball = {x:720, y:280, vx:0, vy:0, angle:0, lastTeam:-1, trail:[]};
  }
  makePlayer(x, team, captain) {
    return {x, y:WORLD.ground, vx:0, vy:0, team, captain, grounded:true, facing:team===0?1:-1, cooldown:0, swing:0, run:0, jumpHeld:false, stamina:100, recovery:0};
  }
  start(mode = 'solo') {
    this.mode=mode; this.scores=[0,0]; this.time=120; this.overtime=false;
    this.selectedPlayers=[0,2];this.selectionHeld.clear();
    this.elapsed=0; this.particles=[]; this.resetCourt(); this.state='playing';
    this.ball.vx=mode==='solo'?-100:0;
    this.onEvent({type:'start'});
  }
  pause() { if(this.state==='playing'||this.state==='goal'){this.beforePause=this.state;this.state='paused';return true;} return false; }
  resume() { if(this.state==='paused'){this.state=this.beforePause;this.selectionHeld.clear();return true;} return false; }
  home() {this.state='ready';this.scores=[0,0];this.time=120;this.overtime=false;this.particles=[];this.selectedPlayers=[0,2];this.selectionHeld.clear();this.resetCourt();}
  isHumanControlled(player) {
    return (player.team===0||this.mode==='duo')&&this.players[this.selectedPlayers[player.team]]===player;
  }
  selectPlayer(team,number) {
    if(this.state!=='playing'||![0,1].includes(team)||![1,2].includes(number)||(team===1&&this.mode!=='duo'))return false;
    const index=team*2+number-1;
    if(this.selectedPlayers[team]===index)return false;
    this.selectedPlayers[team]=index;
    this.onEvent({type:'selection',team,number});
    return true;
  }
  switchPlayer(team) {
    if(![0,1].includes(team))return false;
    return this.selectPlayer(team,this.selectedPlayers[team]===team*2?2:1);
  }
  updateSelection(keys) {
    const pressed=code=>keys.has(code)&&!this.selectionHeld.has(code);
    if(pressed('Digit1'))this.selectPlayer(0,1);
    else if(pressed('Digit2'))this.selectPlayer(0,2);
    else if(pressed('KeyK'))this.switchPlayer(0);
    if(pressed('Enter'))this.switchPlayer(1);
    this.selectionHeld=new Set(['Digit1','Digit2','KeyK','Enter'].filter(code=>keys.has(code)));
  }
  step(dt, keys = new Set()) {
    if(!Number.isFinite(dt)||dt<=0) return;
    dt=Math.min(dt,1/30);
    if(this.state==='paused'||this.state==='finished'||this.state==='ready')return;
    this.elapsed+=dt;
    this.updateParticles(dt);
    if(this.state==='goal'){
      this.goalDelay-=dt;
      if(this.goalDelay<=0){this.resetCourt();this.ball.vx=this.lastScorer===0?120:-120;this.state='playing';this.onEvent({type:'serve'});}
      return;
    }
    if(!this.overtime){
      this.time=Math.max(0,this.time-dt);
      if(this.time===0){
        if(this.scores[0]!==this.scores[1]){this.finish();return;}
        this.overtime=true;this.onEvent({type:'overtime'});
      }
    }
    this.updateSelection(keys);
    for(const p of this.players){
      p.cooldown=Math.max(0,p.cooldown-dt);p.swing=Math.max(0,p.swing-dt);
      p.recovery=Math.max(0,p.recovery-dt);
      if(p.recovery===0)p.stamina=Math.min(100,p.stamina+34*dt);
      const human=this.isHumanControlled(p);
      let move=0,jump=false,hit=false;
      if(human){
        const left=p.team===0?'KeyA':'ArrowLeft',right=p.team===0?'KeyD':'ArrowRight';
        move=Number(keys.has(right))-Number(keys.has(left));
        jump=keys.has(p.team===0?'Space':'ArrowUp');
        hit=keys.has(p.team===0?'KeyJ':'ArrowDown');
      }else{
        const action=this.ai(p);move=action.move;jump=action.jump;hit=action.hit;
      }
      const speed=human||p.captain?292:236;
      p.vx+=(move*speed-p.vx)*Math.min(1,dt*15);
      if(move)p.facing=move;
      p.x=clamp(p.x+p.vx*dt,66,WORLD.width-66);
      p.run+=Math.abs(p.vx)*dt*.045;
      if(jump&&!p.jumpHeld&&p.grounded){p.vy=-640;p.grounded=false;this.dust(p.x,p.y,p.team,7);this.onEvent({type:'jump',human});}
      p.jumpHeld=jump;
      p.vy+=WORLD.gravity*dt;p.y+=p.vy*dt;
      if(p.y>=WORLD.ground){if(!p.grounded)this.dust(p.x,WORLD.ground,p.team,5);p.y=WORLD.ground;p.vy=0;p.grounded=true;}
      if(hit&&p.cooldown<=0&&p.stamina>=25){
        p.swing=.24;p.cooldown=human?.46:.82;p.stamina-=25;p.recovery=.5;
        this.strike(p,human);
      }
    }
    this.updateBall(dt);
  }
  ai(p) {
    const b=this.ball,team=p.team;
    const humanMate=team===0||this.mode==='duo';
    const captain=this.players[humanMate?this.selectedPlayers[team]:team*2];
    let target;
    if(humanMate){
      // The unselected teammate supports whichever player the human controls.
      const onOwnSide=team===0?b.x<620:b.x>820;
      target=onOwnSide&&Math.abs(captain.x-b.x)>190?b.x+b.vx*.20:(team===0?280:1160);
    }else if(!p.captain){
      target=Math.abs(captain.x-b.x)>260?b.x+b.vx*.22:1010;
    }else target=b.x+b.vx*.23+(team===0?-34:34);
    target=clamp(target,90,1350);
    const dx=target-p.x;
    const nearBall=Math.abs(b.x-p.x)<120;
    const shouldHit=Math.hypot(b.x-p.x,b.y-(p.y-39))<98;
    return {move:Math.abs(dx)>17?Math.sign(dx):0,jump:nearBall&&b.y<p.y-60&&b.y>p.y-270&&!p.jumpHeld,hit:shouldHit};
  }
  strike(p, human) {
    const b=this.ball;
    if(Math.hypot(b.x-p.x,b.y-(p.y-42))>112)return false;
    const targetX=p.team===0?WORLD.rightHoop:WORLD.leftHoop;
    const distance=targetX-b.x;
    const flight=clamp(Math.abs(distance)/(human?610:530),.4,1.7);
    b.vx=distance/flight;
    // A rising hip shot is more accurate than a grounded one.
    const targetY=WORLD.hoopY+(p.grounded?13:0);
    b.vy=(targetY-b.y-.5*WORLD.gravity*flight*flight)/flight;
    b.vy=clamp(b.vy,-950,180);
    b.lastTeam=p.team;
    p.facing=Math.sign(distance);
    this.burst(b.x,b.y,p.team===0?'#ffc77e':'#9ce3bd',13);
    this.onEvent({type:'hit',team:p.team,human});
    return true;
  }
  updateBall(dt) {
    const b=this.ball,previousX=b.x,previousY=b.y;
    b.vy+=WORLD.gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.vx*dt*.018;
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();
    for(const [goalX,team] of [[WORLD.leftHoop,1],[WORLD.rightHoop,0]]){
      if((previousX-goalX)*(b.x-goalX)<=0&&Math.abs(b.x-previousX)>.01){
        const fraction=(goalX-previousX)/(b.x-previousX);
        const crossingY=previousY+(b.y-previousY)*fraction;
        if(Math.abs(crossingY-WORLD.hoopY)<WORLD.hoopRadius-WORLD.ballRadius*.45){this.score(team);return;}
      }
      // Stone rim collisions leave a visible, forgiving opening.
      for(const rimY of [WORLD.hoopY-41,WORLD.hoopY+41]){
        const dx=b.x-goalX,dy=b.y-rimY,dist=Math.hypot(dx,dy);
        if(dist<23&&dist>0){const nx=dx/dist,ny=dy/dist,dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=1.65*dot*nx;b.vy-=1.65*dot*ny;b.x=goalX+nx*23;b.y=rimY+ny*23;this.onEvent({type:'bounce'});}}
      }
    }
    const floor=WORLD.ground-WORLD.ballRadius;
    if(b.y>floor){b.y=floor;if(Math.abs(b.vy)>75){b.vy=-Math.abs(b.vy)*.76;this.dust(b.x,WORLD.ground,b.lastTeam,4);this.onEvent({type:'bounce'});}else b.vy=0;b.vx*=.96;}
    if(b.y<102){b.y=102;b.vy=Math.abs(b.vy)*.8;}
    if(b.x<36){b.x=36;b.vx=Math.abs(b.vx)*.8;}
    if(b.x>WORLD.width-36){b.x=WORLD.width-36;b.vx=-Math.abs(b.vx)*.8;}
    for(const p of this.players){
      const dx=b.x-p.x,dy=b.y-(p.y-36),dist=Math.hypot(dx,dy);
      if(dist<35&&dist>0&&p.swing<=0){
        const nx=dx/dist,ny=dy/dist;
        b.x=p.x+nx*36;b.y=p.y-36+ny*36;
        const approach=b.vx*nx+b.vy*ny;
        if(approach<0){b.vx-=1.4*approach*nx;b.vy-=1.4*approach*ny;}
        b.vx+=p.vx*.38;b.vy=Math.min(b.vy,-125);
      }
    }
    if(Math.abs(b.vx)<8&&b.y>floor-2){b.vx=b.x<720?32:-32;}
  }
  score(team) {
    if(this.state!=='playing')return;
    this.scores[team]++;this.lastScorer=team;
    this.burst(team===0?WORLD.rightHoop:WORLD.leftHoop,WORLD.hoopY,team===0?'#ffd080':'#a0e7ba',65);
    this.onEvent({type:'goal',team,scores:[...this.scores]});
    if(this.scores[team]>=5||this.overtime){this.finish();return;}
    this.state='goal';this.goalDelay=2.2;
  }
  finish(){this.state='finished';this.winner=this.scores[0]>this.scores[1]?0:1;this.onEvent({type:'finish',winner:this.winner,scores:[...this.scores]});}
  dust(x,y,team,count){for(let i=0;i<count;i++)this.particles.push({x,y,vx:(Math.random()-.5)*95,vy:-Math.random()*65,life:.35+Math.random()*.25,max:.6,size:2+Math.random()*3,color:'#d7c291',gravity:130});}
  burst(x,y,color,count){for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,speed=50+Math.random()*260;this.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-80,life:.4+Math.random()*.65,max:1.05,size:2+Math.random()*5,color,gravity:300});}}
  updateParticles(dt){for(const p of this.particles){p.x+=p.vx*dt;p.vy+=p.gravity*dt;p.y+=p.vy*dt;p.life-=dt;}this.particles=this.particles.filter(p=>p.life>0);}
}

const W = WORLD;

const SCALE=3,WIDTH=480,HEIGHT=220;
const BODY=[
  '..f..f...........',
  '..F..F..f........',
  '...F.F.F.........',
  '....fff..........',
  '....ooo..........',

    if(!this.reducedMotion){
      for(let i=0;i<17;i++){
        const x=(i*37+Math.sin(t*.4+i)*8)%480,y=177-((t*(2+i%3)+i*13)%130);
        c.globalAlpha=.15+Math.sin(t+i)*.12;this.rect(c,x,y,1,1,i%3?'#c09c67':'#9bada5');
      }c.globalAlpha=1;
    }
    c.restore();
    this.ctx.imageSmoothingEnabled=false;this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    this.ctx.drawImage(this.surface,0,0,this.canvas.width,this.canvas.height);
  }
}


const $=id=>document.getElementById(id);
const canvas=$('gameCanvas'),renderer=new Renderer(canvas),keys=new Set();
let mode='solo',soundEnabled=false,audioContext,freezeUntil=0;
const match=new Match(handleEvent);

function tone(frequency,duration,type='sine',gain=.065,delay=0){
  if(!soundEnabled||!audioContext)return;
  const start=audioContext.currentTime+delay;
  const oscillator=audioContext.createOscillator(),envelope=audioContext.createGain();
  oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,start);
  oscillator.frequency.exponentialRampToValueAtTime(Math.max(32,frequency*.45),start+duration);
  envelope.gain.setValueAtTime(.001,start);envelope.gain.exponentialRampToValueAtTime(gain,start+.012);envelope.gain.exponentialRampToValueAtTime(.001,start+duration);
  oscillator.connect(envelope);envelope.connect(audioContext.destination);oscillator.start(start);oscillator.stop(start+duration+.02);
}

function updateHUD(){
  $('sunScore').textContent=match.scores[0];$('jadeScore').textContent=match.scores[1];
  const seconds=Math.ceil(match.time);
  $('clock').textContent=match.overtime?'◆':`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
  $('clock').setAttribute('aria-label',match.overtime?'Punto de oro':`${seconds} segundos`);
  $('hud').classList.toggle('overtime',match.overtime);
}

function handleEvent(event){
  if(event.type==='start'){tone(98,.38,'triangle');tone(147,.45,'sine',.04,.12);}
  if(event.type==='selection')$('announcement').textContent=`${event.team===0?'Sol':'Jade'}: jugador ${event.number}`;
  if(event.type==='hit'){
    tone(76,.17,'triangle',event.human?.10:.045);renderer.impact(event.team,.18);
    if(!renderer.reducedMotion)freezeUntil=performance.now()+42;
  }
  if(event.type==='bounce')tone(48,.09,'sine',.025);
  if(event.type==='jump'&&event.human)tone(130,.12,'triangle',.025);
  if(event.type==='goal'){
    updateHUD();renderer.goal(event.team);
    $('announcement').textContent=`${event.team===0?'Sol':'Jade'} anota. ${match.scores[0]} a ${match.scores[1]}.`;
    [98,147,196].forEach((note,i)=>tone(note,.6,'triangle',.065,i*.14));
  }
  if(event.type==='overtime'){$('announcement').textContent='Punto de oro';updateHUD();}
  if(event.type==='finish'){
    keys.clear();
    $('overlayTitle').textContent=mode==='solo'?(event.winner===0?'Victoria':'Derrota'):(event.winner===0?'Sol':'Jade');
    $('resumeButton').textContent='Revancha';$('gameOverlay').hidden=false;$('pauseButton').hidden=true;
    refreshTouch();updateHUD();$('resumeButton').focus({preventScroll:true});
  }
}

function chooseMode(next){
  if(match.state!=='ready')return;
  mode=next;match.mode=next;
  for(const [id,value]of[['soloButton','solo'],['duoButton','duo']]){
    $(id).classList.toggle('selected',next===value);$(id).setAttribute('aria-pressed',String(next===value));
  }
}

function refreshTouch(){
  const touch=matchMedia('(pointer: coarse)').matches||navigator.maxTouchPoints>0;
  $('mobileControls').hidden=!(touch&&(match.state==='playing'||match.state==='goal'));
}

function start(){
  keys.clear();freezeUntil=0;renderer.resetEffects();$('announcement').textContent='';
  $('gameOverlay').hidden=true;$('readyMenu').hidden=true;$('hud').hidden=false;$('pauseButton').hidden=false;
  $('pauseButton').setAttribute('aria-label','Pausar');
  if(soundEnabled&&audioContext?.state==='suspended')audioContext.resume();
  match.start(mode);updateHUD();refreshTouch();canvas.focus({preventScroll:true});
}

function pause(){
  if(!match.pause())return;
  keys.clear();refreshTouch();$('pauseButton').setAttribute('aria-label','Continuar');
  $('overlayTitle').textContent='Pausa';$('resumeButton').textContent='Continuar';$('gameOverlay').hidden=false;
  $('resumeButton').focus({preventScroll:true});
}

function resume(){
  if(match.state==='finished'){start();return;}
  if(match.resume()){
    $('gameOverlay').hidden=true;$('pauseButton').setAttribute('aria-label','Pausar');
    keys.clear();refreshTouch();canvas.focus({preventScroll:true});
  }
}

function home(){
  keys.clear();match.home();renderer.resetEffects();$('announcement').textContent='';
  $('gameOverlay').hidden=true;$('readyMenu').hidden=false;$('pauseButton').hidden=true;$('hud').hidden=true;
  chooseMode(mode);updateHUD();refreshTouch();$('startButton').focus({preventScroll:true});
}

$('soloButton').addEventListener('click',()=>chooseMode('solo'));
$('duoButton').addEventListener('click',()=>chooseMode('duo'));
$('startButton').addEventListener('click',start);
$('pauseButton').addEventListener('click',()=>match.state==='paused'?resume():pause());
$('resumeButton').addEventListener('click',resume);
$('newMatchButton').addEventListener('click',home);
$('soundButton').addEventListener('click',async()=>{
  try{
    if(!audioContext){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext=new Audio();}
    if(audioContext.state==='suspended')await audioContext.resume();
    soundEnabled=!soundEnabled;$('soundButton').setAttribute('aria-pressed',String(soundEnabled));
    $('soundButton').setAttribute('aria-label',soundEnabled?'Silenciar sonido':'Activar sonido');
    if(soundEnabled)tone(147,.2,'triangle',.04);
  }catch{$('soundButton').setAttribute('aria-label','Sonido no disponible');}
});
$('fullscreenButton').addEventListener('click',async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen();}
  catch{$('announcement').textContent='Pantalla completa no disponible';}
});
if(!document.fullscreenEnabled)$('fullscreenButton').hidden=true;
document.addEventListener('fullscreenchange',()=>{$('fullscreenButton').setAttribute('aria-label',document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa');});

const playKeys=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyJ','KeyK','Digit1','Digit2','Enter']);
window.addEventListener('keydown',event=>{
  if(event.code==='Escape'||event.code==='KeyP'){
    if(event.repeat)return;
    if(match.state==='paused'){event.preventDefault();resume();}
    else if(match.state==='playing'||match.state==='goal'){event.preventDefault();pause();}
    return;
  }
  if(playKeys.has(event.code)&&(match.state==='playing'||match.state==='goal')){
    if((event.code==='Space'||event.code==='Enter')&&event.target instanceof HTMLButtonElement)return;
    event.preventDefault();keys.add(event.code);
  }
});
window.addEventListener('keyup',event=>keys.delete(event.code));
function onLeave(){keys.clear();pause();}
window.addEventListener('blur',onLeave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)onLeave();});
window.addEventListener('resize',refreshTouch);

for(const button of document.querySelectorAll('[data-key]')){
  const release=event=>{
    keys.delete(button.dataset.key);button.classList.remove('pressed');
    if(event?.pointerId&&button.hasPointerCapture(event.pointerId))button.releasePointerCapture(event.pointerId);
  };
  button.addEventListener('pointerdown',event=>{event.preventDefault();button.setPointerCapture(event.pointerId);keys.add(button.dataset.key);button.classList.add('pressed');});
  button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release);
  button.addEventListener('contextmenu',event=>event.preventDefault());
}

let last=performance.now(),accumulator=0,lastHUD=-1;
function frame(now){
  const dt=Math.min((now-last)/1000,.08);last=now;
  if(now<freezeUntil)accumulator=0;
  else{
    accumulator+=dt;
    while(accumulator>=1/120){match.step(1/120,keys);accumulator-=1/120;}
  }
  if(Math.ceil(match.time)!==lastHUD){lastHUD=Math.ceil(match.time);updateHUD();}
  renderer.draw(match,now/1000,dt);requestAnimationFrame(frame);
}
updateHUD();requestAnimationFrame(frame);
</script>
</body>
</html>
